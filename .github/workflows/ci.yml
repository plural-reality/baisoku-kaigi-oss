name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_AUTH_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_AUTH_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: "ci"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npx vitest run --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_AUTH_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_AUTH_SUPABASE_ANON_KEY: "dummy-key"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Ports away from the usual local dev ones (3000, 8080, 9090): the self-hosted runner is a
      # developer Mac. The runner stops the stub servers when the job ends.
      - name: Start stub servers
        run: |
          node tests/e2e/fixtures/haskell-stub.mjs &
          node tests/e2e/fixtures/llm-stub.mjs &
        env:
          HASKELL_STUB_PORT: "18080"
          LLM_STUB_PORT: "19090"
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_AUTH_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_AUTH_SUPABASE_ANON_KEY: "dummy-key"
          HASKELL_BACKEND_URL: "http://localhost:18080"
          OPENROUTER_API_URL: "http://localhost:19090/api/v1/chat/completions"
          PORT: "13000"
          PLAYWRIGHT_BASE_URL: "http://localhost:13000"
          OPENROUTER_API_KEY: "test-key"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
