name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_AUTH_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_AUTH_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: "ci"

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npx vitest run --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          NEXT_PUBLIC_AUTH_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_AUTH_SUPABASE_ANON_KEY: "dummy-key"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The specs read a seeded session (tests/e2e/fixtures/seed-e2e.sql) from a
      # local Supabase started from supabase/config.toml (API 55321, DB 55322).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.75.0
      - name: Start Supabase and seed the E2E session
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          psql "postgresql://postgres:postgres@127.0.0.1:55322/postgres" -v ON_ERROR_STOP=1 -f tests/e2e/fixtures/seed-e2e.sql
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      # The runner stops the stub servers when the job ends.
      - name: Start stub servers
        run: |
          node tests/e2e/fixtures/haskell-stub.mjs &
          node tests/e2e/fixtures/llm-stub.mjs &
        env:
          HASKELL_STUB_PORT: "18080"
          LLM_STUB_PORT: "19090"
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      # Serve a production build: next dev compiles each route on its first
      # request, which made the first specs time out while joining.
      - name: Build for E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          HASKELL_BACKEND_URL: "http://localhost:18080"
          OPENROUTER_API_URL: "http://localhost:19090/api/v1/chat/completions"
          PORT: "13000"
          PLAYWRIGHT_BASE_URL: "http://localhost:13000"
          OPENROUTER_API_KEY: "test-key"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
